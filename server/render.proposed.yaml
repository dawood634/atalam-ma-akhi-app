# Free-only proposal. No persistent Render disk and no paid compute plan.
# Requires a separately provisioned free Neon PostgreSQL database.
services:
  - type: web
    name: atalam-ma-akhi-classroom-api
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: gunicorn 'server.app:create_app()' --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 30 --access-logfile -
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: REQUIRE_EXTERNAL_DATABASE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: TEACHER_INVITE
        sync: false
