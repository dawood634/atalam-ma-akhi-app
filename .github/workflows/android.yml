name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      publish_final:
        description: 'Publish only after all final-release checks pass'
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Audit curriculum coverage and final-release readiness
        run: |
          python3 tools/catalog_audit.py
          python3 tools/release_gate.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 -m unittest server.test_app -v
      - name: Verify classroom deployment entry point
        run: |
          python3 -m pip install -r server/requirements.txt
          python3 -m gunicorn --check-config 'server.app:create_app()'
        env:
          CLASSROOM_DATA_DIR: /tmp/atalam-classroom-check
      - name: Enforce final-release gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_final }}
        run: python3 tools/release_gate.py --require-ready
      - name: Reuse trial signing key across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/atalam-curriculum.keystore
          key: atalam-curriculum-signing-v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare cached curriculum preview signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/atalam-curriculum.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/atalam-curriculum.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate Android scaffolding without replacing app sources
        run: |
          flutter create /tmp/android_shell --platforms=android --org=com.dawood.curricula --project-name atalam_ma_akhi
          cp -R /tmp/android_shell/android ./android
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text().replace('android:label="atalam_ma_akhi"', 'android:label="أتعلم مع أخي - تجربة المناهج"')
          s = s.replace('<application', '<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n    <application', 1)
          s = s.replace('    <application', '    <uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          s = s.replace('<application', '<application android:allowBackup="false"', 1)
          p.write_text(s)
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('android {', 'android {\n    signingConfigs {\n        getByName("debug") {\n            storeFile = file(System.getProperty("user.home") + "/.android/atalam-curriculum.keystore")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }', 1)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release --dart-define=CLASSROOM_API_URL="${CLASSROOM_API_URL}"
        env:
          CLASSROOM_API_URL: ${{ vars.CLASSROOM_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: atalam-ma-akhi-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      # Builds remain downloadable as CI artifacts for internal QA.
      # Public trial releases are intentionally disabled: one final delivery was requested.
      - name: Require provisioned production signing before final publication
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_final }}
        run: |
          echo "Final publication is blocked until a production signing and distribution workflow is provisioned and verified."
          exit 1
