name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reuse trial signing key across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: atalam-trial-signing-v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate Android scaffolding without replacing app sources
        run: |
          flutter create /tmp/android_shell --platforms=android --org=com.dawood --project-name atalam_ma_akhi
          cp -R /tmp/android_shell/android ./android
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text().replace('android:label="atalam_ma_akhi"', 'android:label="أتعلم مع أخي"')
          s = s.replace('<application', '<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n    <application', 1)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: atalam-ma-akhi-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish downloadable trial APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk atalam-ma-akhi-trial.apk
          gh release create "trial-${GITHUB_RUN_NUMBER}" atalam-ma-akhi-trial.apk --prerelease --title "Android trial ${GITHUB_RUN_NUMBER}" --notes "Version 0.2.0: 200 Arabic words, 128 lessons and activities, typed dictation, letter blending, reading and arithmetic. Teacher reports and progress are local to the device; cross-device synchronization is not included. Development-signed trial APK."
