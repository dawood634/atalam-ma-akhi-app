name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reuse trial signing key across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/atalam-curriculum.keystore
          key: atalam-curriculum-signing-v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare cached curriculum preview signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/atalam-curriculum.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/atalam-curriculum.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate Android scaffolding without replacing app sources
        run: |
          flutter create /tmp/android_shell --platforms=android --org=com.dawood.curricula --project-name atalam_ma_akhi
          cp -R /tmp/android_shell/android ./android
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text().replace('android:label="atalam_ma_akhi"', 'android:label="أتعلم مع أخي - تجربة المناهج"')
          s = s.replace('<application', '<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n    <application', 1)
          p.write_text(s)
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('android {', 'android {\n    signingConfigs {\n        getByName("debug") {\n            storeFile = file(System.getProperty("user.home") + "/.android/atalam-curriculum.keystore")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }', 1)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: atalam-ma-akhi-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish downloadable trial APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk atalam-ma-akhi-trial.apk
          gh release create "trial-${GITHUB_RUN_NUMBER}" atalam-ma-akhi-trial.apk --prerelease --title "Android trial ${GITHUB_RUN_NUMBER}" --notes "Independent curriculum preview, version 0.3.0: Sanaa/Aden curriculum portal, six grade selectors, candidate source inventory and an original interactive sets lesson demo. Full official curriculum alignment is not yet complete. Previous 200-word foundation section is retained. Teacher reports and progress are local to the device; cross-device synchronization is not included. Development-signed trial APK."
